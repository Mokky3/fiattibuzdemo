services:
  db:
    image: postgres:16
    container_name: fiattib_postgres
    restart: unless-stopped
    env_file: .env.db
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fiattib}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: fiattib_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fiattib.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports: ["8081:80"]
    depends_on: [db]

volumes:
  pgdata:
